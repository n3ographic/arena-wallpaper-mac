name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests (ArenaKit)
        run: cd Packages/ArenaKit && swift test
      - name: Build (app, Debug)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project ArenaWallpaper.xcodeproj -scheme ArenaWallpaper -configuration Debug -derivedDataPath build build
